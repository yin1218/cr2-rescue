name: Bug report / 問題回報
description: Something did not recover as expected / 修復結果不如預期
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach personal photos. / 請不要附上個人照片。
  - type: textarea
    id: what
    attributes:
      label: What happened? / 發生了什麼事？
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: Output of `cr2-rescue scan` and `recover` / 指令輸出
      render: text
  - type: input
    id: camera
    attributes:
      label: Camera model / 相機型號
      placeholder: Canon EOS 70D
  - type: input
    id: tool
    attributes:
      label: Recovery tool used / 使用的救援軟體
      placeholder: PhotoRec 7.2
  - type: input
    id: env
    attributes:
      label: OS, Python and cr2-rescue version / 作業系統、Python、cr2-rescue 版本
      placeholder: macOS 15, Python 3.12, cr2-rescue 0.1.0
